<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="irisGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="25%" stop-color="#06B6D4"/>
      <stop offset="55%" stop-color="#1E1B4B"/>
      <stop offset="85%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="pupilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="50%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#skinGrad)"/>
  
  <!-- Outer Eye Contour (Macro Photography Chiaroscuro) -->
  <path d="M40 250 Q200 130 360 250 Q200 370 40 250 Z" fill="#030712" stroke="#27272A" stroke-width="2"/>
  
  <!-- Sclera -->
  <path d="M48 250 Q200 142 352 250 Q200 358 48 250 Z" fill="#18181B"/>
  
  <!-- Iris -->
  <circle cx="200" cy="250" r="88" fill="url(#irisGrad)"/>
  <circle cx="200" cy="250" r="88" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Iris Digital Fibers / AI Matrix -->
  <g stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1">
    <line x1="200" y1="162" x2="200" y2="195"/>
    <line x1="200" y1="305" x2="200" y2="338"/>
    <line x1="112" y1="250" x2="145" y2="250"/>
    <line x1="255" y1="250" x2="288" y2="250"/>
    <line x1="138" y1="188" x2="161" y2="211"/>
    <line x1="239" y1="289" x2="262" y2="312"/>
    <line x1="138" y1="312" x2="161" y2="289"/>
    <line x1="239" y1="211" x2="262" y2="188"/>
  </g>
  
  <!-- Pupil -->
  <circle cx="200" cy="250" r="38" fill="#000000"/>
  <circle cx="200" cy="250" r="36" fill="url(#pupilGlow)"/>
  <circle cx="200" cy="250" r="14" fill="#000000"/>
  <circle cx="200" cy="250" r="4" fill="#FFFFFF"/>
  
  <!-- Light Reflection Glare -->
  <ellipse cx="180" cy="225" rx="20" ry="12" fill="#FFFFFF" opacity="0.6" transform="rotate(-25 180 225)"/>
  
  <!-- Vignette overlay -->
  <rect width="400" height="500" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
</svg>
