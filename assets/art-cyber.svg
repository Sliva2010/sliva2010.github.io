<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="#0A0506"/>
  <circle cx="200" cy="250" r="160" fill="url(#redGlow)"/>

  <!-- 3D Cyber Vortex Rings -->
  <ellipse cx="200" cy="250" rx="140" ry="45" fill="none" stroke="#EF4444" stroke-width="1.5" transform="rotate(-20 200 250)"/>
  <ellipse cx="200" cy="250" rx="110" ry="35" fill="none" stroke="#F87171" stroke-width="1.2" stroke-dasharray="8,6" transform="rotate(25 200 250)"/>
  <ellipse cx="200" cy="250" rx="80" ry="25" fill="none" stroke="#EF4444" stroke-width="1.8" transform="rotate(-60 200 250)"/>
  <ellipse cx="200" cy="250" rx="50" ry="15" fill="none" stroke="#FCA5A5" stroke-width="2" transform="rotate(45 200 250)"/>

  <!-- Center Core -->
  <circle cx="200" cy="250" r="18" fill="#EF4444" filter="drop-shadow(0 0 12px #EF4444)"/>
  <circle cx="200" cy="250" r="6" fill="#FFFFFF"/>

  <!-- Digital Grid Crosshairs -->
  <line x1="200" y1="90" x2="200" y2="410" stroke="#EF4444" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="40" y1="250" x2="360" y2="250" stroke="#EF4444" stroke-opacity="0.2" stroke-width="1"/>
</svg>
