<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="cryptoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="prismTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="prismLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="prismRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="#070908"/>
  <circle cx="200" cy="240" r="150" fill="url(#cryptoGlow)"/>

  <!-- Floating 3D Isometric Crystal / Blockchain Token -->
  <!-- Top Face -->
  <polygon points="200,140 280,185 200,230 120,185" fill="url(#prismTop)" opacity="0.85"/>
  <!-- Left Face -->
  <polygon points="120,185 200,230 200,325 120,280" fill="url(#prismLeft)"/>
  <!-- Right Face -->
  <polygon points="200,230 280,185 280,280 200,325" fill="url(#prismRight)"/>

  <!-- Wireframe Accents -->
  <polygon points="200,140 280,185 200,230 120,185" fill="none" stroke="#6EE7B7" stroke-width="1.5"/>
  <polygon points="120,185 200,230 200,325 120,280" fill="none" stroke="#34D399" stroke-width="1.5"/>
  <polygon points="200,230 280,185 280,280 200,325" fill="none" stroke="#10B981" stroke-width="1.5"/>

  <!-- Orbiting Nodes & Data Ring -->
  <ellipse cx="200" cy="240" rx="140" ry="50" fill="none" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="6,8"/>
  <circle cx="70" cy="225" r="4" fill="#34D399"/>
  <circle cx="330" cy="255" r="4" fill="#10B981"/>
</svg>
