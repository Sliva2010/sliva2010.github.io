<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="carGlow" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#0E0E12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A"/>
      <stop offset="50%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="#08080A"/>
  <circle cx="200" cy="300" r="160" fill="url(#carGlow)"/>

  <!-- Supercar Aggressive Front/Side Silhouette in Shadow -->
  <!-- Roofline -->
  <path d="M70 290 Q120 180 230 185 Q310 200 350 280 L360 320 Q200 340 50 320 Z" fill="url(#bodyReflect)" stroke="#3F3F46" stroke-width="1.5"/>
  <!-- Windshield -->
  <path d="M140 210 Q220 200 270 240 L160 260 Z" fill="#09090B" stroke="#27272A" stroke-width="1"/>
  
  <!-- LED Headlight Laser Slash -->
  <path d="M80 295 L140 300 L95 305 Z" fill="#06B6D4" filter="drop-shadow(0px 0px 8px #06B6D4)"/>
  <path d="M280 295 L340 290 L325 300 Z" fill="#06B6D4" filter="drop-shadow(0px 0px 8px #06B6D4)"/>

  <!-- Aerodynamic splitter & carbon reflection -->
  <path d="M60 325 L350 325 L340 335 L70 335 Z" fill="#18181B" stroke="#52525B" stroke-width="1"/>
  
  <!-- Wet floor reflection -->
  <ellipse cx="200" cy="360" rx="150" ry="25" fill="#06B6D4" opacity="0.1" filter="blur(8px)"/>
  <line x1="90" y1="360" x2="310" y2="360" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="2"/>
</svg>
