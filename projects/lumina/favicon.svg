<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d17" />
      <stop offset="100%" stop-color="#14172b" />
    </linearGradient>

    <!-- Neon Cyber Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Container with subtle neon stroke -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="1.8" />

  <!-- Outer Aperture Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- High-Tech Camera Aperture Blades (Vector Iris) -->
  <path d="M 32 14 L 46 22 L 40 34 Z" fill="url(#neonGrad)" opacity="0.85" />
  <path d="M 46 22 L 50 38 L 38 38 Z" fill="url(#neonGrad)" opacity="0.75" />
  <path d="M 50 38 L 40 50 L 32 40 Z" fill="url(#neonGrad)" opacity="0.85" />
  <path d="M 40 50 L 24 50 L 26 38 Z" fill="url(#neonGrad)" opacity="0.75" />
  <path d="M 24 50 L 14 38 L 26 32 Z" fill="url(#neonGrad)" opacity="0.85" />
  <path d="M 14 38 L 18 22 L 30 26 Z" fill="url(#neonGrad)" opacity="0.75" />

  <!-- Central Luminous AI Sparkle -->
  <circle cx="32" cy="32" r="8" fill="url(#coreGlow)" />
  <path d="M 32 20 Q 32 32 44 32 Q 32 32 32 44 Q 32 32 20 32 Q 32 32 32 20 Z" fill="#ffffff" />
  <circle cx="32" cy="32" r="2" fill="#22d3ee" />
</svg>
