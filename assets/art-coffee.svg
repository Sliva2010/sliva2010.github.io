<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="60%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="#0C0A09"/>
  <circle cx="200" cy="250" r="150" fill="url(#amberGlow)"/>

  <!-- Minimalist Chiaroscuro Coffee Cup & Roast Beans -->
  <!-- Coffee Cup Silhouette -->
  <path d="M120 220 L135 320 Q200 350 265 320 L280 220 Z" fill="#1C1917" stroke="#78350F" stroke-width="1.5"/>
  <ellipse cx="200" cy="220" rx="80" ry="22" fill="#292524" stroke="#D97706" stroke-width="1.5"/>
  <ellipse cx="200" cy="220" rx="72" ry="18" fill="#451A03"/>
  
  <!-- Steam rising in chiaroscuro -->
  <path d="M170 180 Q160 140 185 110 Q210 80 190 50" fill="none" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="2"/>
  <path d="M210 170 Q225 130 205 100 Q185 70 215 40" fill="none" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.5"/>
  
  <!-- Specialty Bean in Forefront -->
  <ellipse cx="290" cy="340" rx="35" ry="24" fill="url(#beanGrad)" stroke="#B45309" stroke-width="1" transform="rotate(-30 290 340)"/>
  <path d="M270 348 Q290 340 310 332" fill="none" stroke="#D97706" stroke-width="2"/>
</svg>
